<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spendly Tracker</title>

    <!-- Website CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./favicon.png">
    <link rel="shortcut icon" type="image/png" href="./favicon.png">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >
</head>

<body>

    <div class="page">


        <!-- ================= HEADER ================= -->

        <header class="header">

            <div class="brand">

                <img
                    src="spendly-logo.png"
                    alt="Spendly Tracker Logo"
                    class="brand-logo"
                >

            </div>

        </header>


        <!-- ================= TOTAL CARD ================= -->

        <section class="summary-card">

            <div class="summary-left">

                <div class="summary-icon">
                    💳
                </div>

                <div>

                    <p class="summary-label">
                        TOTAL EXPENSES
                    </p>

                    <h2>
                        ₹<span id="total">0.00</span>
                    </h2>

                    <p class="summary-subtitle">
                        Your total spending
                    </p>

                </div>

            </div>

            <div class="summary-decoration">
                📊
            </div>

        </section>


        <!-- ================= ADD EXPENSE ================= -->

        <section class="card">

            <div class="section-heading">

                <div>

                    <h2>
                        ➕ Add New Expense
                    </h2>

                    <p>
                        Record your spending details below
                    </p>

                </div>

            </div>


            <div class="input-section">


                <!-- DESCRIPTION -->

                <div class="input-group">

                    <label for="desc">
                        Description
                    </label>

                    <input
                        type="text"
                        id="desc"
                        placeholder="e.g. Lunch at restaurant"
                    >

                </div>


                <!-- CATEGORY -->

                <div class="input-group">

                    <label for="category">
                        Category
                    </label>

                    <select id="category">

                        <option value="">
                            Select Category
                        </option>

                        <option value="Food">
                            🍔 Food
                        </option>

                        <option value="Transport">
                            🚌 Transport
                        </option>

                        <option value="Shopping">
                            🛍 Shopping
                        </option>

                        <option value="Bills">
                            💡 Bills
                        </option>

                        <option value="Entertainment">
                            🎬 Entertainment
                        </option>

                        <option value="Education">
                            📚 Education
                        </option>

                        <option value="Healthcare">
                            🏥 Healthcare
                        </option>

                        <option value="Utilities">
                            ⚡ Utilities
                        </option>

                        <option value="Others">
                            📦 Others
                        </option>

                    </select>

                </div>


                <!-- EXPENSE DATE -->

                <div class="input-group">

                    <label for="date">
                        Expense Date
                    </label>

                    <input
                        type="date"
                        id="date"
                    >

                </div>


                <!-- AMOUNT -->

                <div class="input-group">

                    <label for="amount">
                        Amount
                    </label>

                    <div class="amount-input">

                        <span>₹</span>

                        <input
                            type="number"
                            id="amount"
                            placeholder="0.00"
                            min="0"
                            step="0.01"
                        >

                    </div>

                </div>

            </div>


            <!-- ADD EXPENSE BUTTON -->

            <button
                class="add-btn"
                onclick="addExpense()"
            >

                <span>＋</span>

                Add Expense

            </button>

        </section>


        <!-- ================= TRANSACTIONS ================= -->

        <section class="card transactions-card">

            <div class="section-heading transactions-heading">

                <div>

                    <h2>
                        📋 Recent Transactions
                    </h2>

                    <p>
                        View and manage your expenses
                    </p>

                </div>

            </div>


            <!-- ================= SEARCH + FILTER ================= -->

            <div class="filter-section">


                <!-- SEARCH -->

                <div class="search-box">

                    <span>🔍</span>

                    <input
                        type="text"
                        id="search"
                        placeholder="Search by description..."
                    >

                </div>


                <!-- CATEGORY FILTER -->

                <select id="filterCategory">

                    <option value="All">
                        All Categories
                    </option>

                    <option value="Food">
                        🍔 Food
                    </option>

                    <option value="Transport">
                        🚌 Transport
                    </option>

                    <option value="Shopping">
                        🛍 Shopping
                    </option>

                    <option value="Bills">
                        💡 Bills
                    </option>

                    <option value="Entertainment">
                        🎬 Entertainment
                    </option>

                    <option value="Education">
                        📚 Education
                    </option>

                    <option value="Healthcare">
                        🏥 Healthcare
                    </option>

                    <option value="Utilities">
                        ⚡ Utilities
                    </option>

                    <option value="Others">
                        📦 Others
                    </option>

                </select>

            </div>


            <!-- ================= TABLE ================= -->

            <div class="table-container">

                <table id="expenseTable">

                    <thead>

                        <tr>

                            <th>S.No</th>

                            <th>Description</th>

                            <th>Category</th>

                            <th>Date & Time</th>

                            <th>Amount</th>

                            <th>Action</th>

                        </tr>

                    </thead>

                    <tbody id="expenseBody">

                        <!-- Expenses loaded from MySQL -->

                    </tbody>

                </table>

            </div>

        </section>


        <!-- ================= CLEAR ALL ================= -->

        <div class="footer-actions">

            <button
                class="clear-btn"
                onclick="clearAll()"
            >

                🗑️ Clear All Expenses

            </button>

        </div>


        <!-- ================= FOOTER ================= -->

        <footer>

            <p>
                Spendly Tracker • Personal Expense Management
            </p>

        </footer>


        <!-- ================= LOGOUT ================= -->

        <div class="logout-section">

            <button
                class="logout-btn"
                onclick="logout()"
            >
                ↪ Logout
            </button>

        </div>


    </div>


    <!-- Website JavaScript -->

    <script src="script.js"></script>

</body>

</html>
